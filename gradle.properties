# CI 的 macOS runner 默认 daemon 堆 512MB，K/N 的 framework 链接那步会 GC 抖死
# （旧仓日志原文 "Daemon is stopping immediately since the JVM garbage collector is thrashing"）。
# 3G 堆 + 1G metaspace 让链接走完；本机用户级 gradle.properties 另有自己的设置，互不干扰。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
kotlin.code.style=official

# music 模块（MeiloX 源码）整套依赖 Hilt/KSP：KSP2 是 2.3.x 的默认实现，显式打开让它别退回 KSP1
ksp.UseKSP2=true

# Strong Skipping 在 Kotlin 2.x 的 Compose 编译器里是默认开的，这里不去关它。
# 帧率真正的两笔在别处：UiState 一律标 @Immutable/@Stable，以及 release 开 R8 + Baseline Profile。
